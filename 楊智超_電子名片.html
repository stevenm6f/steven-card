<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>楊智超 | 彰茂企業股份有限公司</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161c24;
    --panel:#1d2531;
    --panel-2:#242e3d;
    --paper:#f3efe6;
    --steel:#8b93a3;
    --webbing:#e2601f;
    --webbing-dark:#b8480f;
    --stitch:#c9a227;
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #263042 0%, var(--ink) 55%),
      var(--ink);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 60px;
    font-family:'Noto Sans TC', sans-serif;
    color:var(--paper);
  }
  .card{
    width:100%;
    max-width:400px;
    background:var(--panel);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04);
    position:relative;
    animation:rise .6s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(14px) scale(.985);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  @media (prefers-reduced-motion: reduce){
    .card{animation:none;}
  }

  /* Webbing stripe — evokes seatbelt webbing, signature element */
  .webbing{
    height:14px;
    width:100%;
    background:repeating-linear-gradient(
      -35deg,
      var(--webbing) 0px, var(--webbing) 16px,
      var(--webbing-dark) 16px, var(--webbing-dark) 32px
    );
    position:relative;
  }
  .webbing::after{
    content:'';
    position:absolute;
    left:0; right:0; top:50%;
    height:1px;
    background:rgba(0,0,0,.25);
    transform:translateY(-50%);
  }

  .head{
    padding:24px 26px 20px;
    border-bottom:1px dashed rgba(255,255,255,.12);
  }
  .logo-chip{
    display:inline-flex;
    align-items:center;
    background:var(--paper);
    border-radius:10px;
    padding:8px 12px;
    margin-bottom:16px;
  }
  .logo-chip img{
    display:block;
    height:26px;
    width:auto;
  }
  .org-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:18px;
  }
  .org-badge{
    font-family:'Roboto Mono', monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    color:var(--webbing);
    border:1px solid rgba(226,96,31,.5);
    padding:3px 8px;
    border-radius:999px;
    text-transform:uppercase;
  }
  .org-name{
    font-size:13px;
    font-weight:500;
    color:var(--steel);
    letter-spacing:.02em;
  }
  .name{
    font-size:30px;
    font-weight:900;
    line-height:1.15;
    margin:0 0 8px;
    color:var(--paper);
  }
  .titles{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .title-line{
    font-size:14.5px;
    font-weight:500;
    color:#d8b98a;
    display:flex;
    align-items:baseline;
    gap:6px;
  }
  .title-line::before{
    content:'';
    width:5px; height:5px;
    border-radius:50%;
    background:var(--webbing);
    display:inline-block;
    margin-right:2px;
  }

  .specs{
    padding:20px 26px 6px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .spec{
    display:flex;
    align-items:center;
    gap:14px;
    padding:11px 0;
    border-bottom:1px solid rgba(255,255,255,.06);
    text-decoration:none;
    color:inherit;
  }
  .spec:last-child{border-bottom:none;}
  .spec-icon{
    width:30px; height:30px;
    flex:0 0 30px;
    border-radius:8px;
    background:var(--panel-2);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--webbing);
  }
  .spec-icon svg{width:16px; height:16px;}
  .spec-body{min-width:0;}
  .spec-label{
    font-family:'Roboto Mono', monospace;
    font-size:9.5px;
    letter-spacing:.13em;
    text-transform:uppercase;
    color:var(--steel);
    margin-bottom:2px;
  }
  .spec-value{
    font-family:'Roboto Mono', monospace;
    font-size:14px;
    color:var(--paper);
    word-break:break-word;
    line-height:1.4;
  }
  a.spec .spec-value{transition:color .15s ease;}
  a.spec:active .spec-value{color:var(--webbing);}

  .actions{
    padding:22px 26px 26px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .btn{
    appearance:none;
    border:none;
    width:100%;
    padding:15px 18px;
    border-radius:12px;
    font-family:'Noto Sans TC', sans-serif;
    font-size:15.5px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    cursor:pointer;
    letter-spacing:.02em;
    transition:transform .12s ease, filter .12s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn svg{width:19px; height:19px; flex:0 0 19px;}
  .btn-line{
    background:#06c755;
    color:#fff;
  }
  .btn-contact{
    background:var(--webbing);
    color:#fff;
  }
  .btn-ghost{
    background:transparent;
    color:var(--steel);
    border:1px solid rgba(255,255,255,.14);
    font-weight:500;
    font-size:13.5px;
    padding:12px 18px;
  }
  .toast{
    position:fixed;
    left:50%; bottom:26px;
    transform:translateX(-50%) translateY(20px);
    background:var(--paper);
    color:var(--ink);
    font-size:13.5px;
    font-weight:700;
    padding:11px 18px;
    border-radius:999px;
    box-shadow:0 12px 30px rgba(0,0,0,.35);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:50;
    white-space:nowrap;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .foot-note{
    text-align:center;
    font-family:'Roboto Mono', monospace;
    font-size:10px;
    color:rgba(139,147,163,.6);
    letter-spacing:.08em;
    margin-top:2px;
  }
  .foot-logo{
    display:flex;
    justify-content:center;
    padding:0 26px 18px;
  }
  .foot-logo-chip{
    display:inline-flex;
    align-items:center;
    background:var(--paper);
    border-radius:10px;
    padding:8px 14px;
  }
  .foot-logo-chip img{
    display:block;
    height:20px;
    width:auto;
  }
</style>
</head>

  <div class="toast" id="toast"></div>

<script>
  const lineId = "0935107315";
  const toastEl = document.getElementById('toast');
  let toastTimer;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 2200);
  }

  // LINE add-friend: try app scheme first, fall back to web
  function openLine(){
    const appUrl = "line://ti/p/~" + lineId;
    const webUrl = "https://line.me/ti/p/~" + lineId;
    const start = Date.now();
    window.location.href = appUrl;
    setTimeout(function(){
      if (Date.now() - start < 1800) {
        window.location.href = webUrl;
      }
    }, 700);
  }
  document.getElementById('addLineBtn').addEventListener('click', function(e){
    e.preventDefault();
    openLine();
  });
  document.getElementById('lineSpec').addEventListener('click', function(e){
    e.preventDefault();
    openLine();
  });

  document.getElementById('copyIdBtn').addEventListener('click', async function(){
    try{
      await navigator.clipboard.writeText(lineId);
      showToast('已複製 LINE ID：' + lineId);
    }catch(err){
      showToast('複製失敗，請手動輸入：' + lineId);
    }
  });

  // vCard generation + download
  function saveContact(){
    const vcard = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:楊;智超;;;",
      "FN:楊智超",
      "ORG:彰茂企業股份有限公司;彰化縣鹿港彰濱工業區廠商協進會",
      "TITLE:特助 / 秘書長",
      "TEL;TYPE=WORK,VOICE:+886-4-7810588,,128",
      "TEL;TYPE=CELL:0935107315",
      "EMAIL;TYPE=WORK:steven@redwood.com.tw",
      "ADR;TYPE=WORK:;;彰化縣鹿港鎮鹿工南二路36號;;;;台灣",
      "NOTE:LINE ID: 0935107315",
      "END:VCARD"
    ].join("\r\n");

    const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = "楊智超_彰茂企業.vcf";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 4000);
    showToast('聯絡人卡片已下載');
  }
  document.getElementById('saveContactBtn').addEventListener('click', saveContact);
</script>
