<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彰茂企業工安、信件宣導與醫護到場日期</title>
    <style>
        body {
            font-family: "Arial", sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #d1d1d1;
        }
        .header {
            position: relative;
            height: 100px;
            background: url('DSC_7661_1s.jpg') no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            color: white;
            font-size: 36px;
            font-weight: bold;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.8);
        }
        .logo {
            height: 80px;
        }
        .navbar {
            background-color: #1f1f1f;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 80px;
            gap: 20px;
        }
        .navbar a {
            color: #ff0000;
            text-decoration: none;
            font-size: 18px;
            padding: 10px 15px;
            transition: 0.3s;
        }
        .navbar a:hover {
            color: #fff;
        }
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
            background: #1e1e1e;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .section {
            margin-bottom: 20px;
            padding: 15px;
            border-left: 5px solid #ff0000;
            background: #222;
            border-radius: 5px;
        }
        .comments {
            margin-top: 20px;
            background: #2b2b2b;
        }
        .comment-box {
            margin-top: 10px;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        button:hover {
            background-color: #cc0000;
        }
        textarea {
            background: #333;
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="logo.png" alt="公司LOGO" class="logo">
        彰茂企業股份有限公司
    </div>
    <div class="navbar">
        <a href="#">首頁</a>
        <a href="#">工安宣導</a>
        <a href="#">信件宣導</a>
        <a href="#">醫護到場</a>
        <a href="#">留言板</a>
    </div>
    <div class="container">
        <div class="section">
            <h3>工安宣導</h3>
            <h4>彰茂職業安全衛生政策如下:</h4>
            <p>1. 遵守職業安全衛生法令及相關規章.</p>
            <p>2. 保護全體員工與所有進入本公司人員之安全衛生.</p>
            <p>3. 持續改善職業安全衛生管理系統及管理績效.</p>
            <p>4. 防止發生與工作有關的傷害或有礙健康的事件.</p>
            <p>5. 積極推動與工作者諮商及參與安全衛生相關議題.</p>
        </div>
        <div class="section">
            <h3>信件宣導</h3>
            <p>定期發送安全與健康相關的信件，提供最新的政策、訓練與應對措施，確保員工了解並能夠應對各種突發情況。</p>
        </div>
        <div class="section">
            <h3>醫護到場日期</h3>
            <p>下次醫護人員到場日期：<strong>2025年4月10日</strong></p>
            <img src="臨場班表2.png" alt="醫護到場班表" style="max-width: 100%; border-radius: 5px; margin-top: 10px;">
        </div>
        <div class="section comments">
            <h3>互動式留言板</h3>
            <div id="commentList"></div>
            <div class="comment-box">
                <textarea id="commentInput" rows="3"></textarea>
                <button onclick="addComment()">提交留言</button>
            </div>
        </div>
    </div>
    
    <script>
        let comments = [];

        function loadComments() {
            const commentList = document.getElementById("commentList");
            commentList.innerHTML = "";
            if (comments.length === 0) {
                commentList.innerHTML = "<p>目前沒有留言</p>";
            } else {
                comments.forEach(comment => {
                    const newComment = document.createElement("p");
                    newComment.textContent = comment;
                    newComment.style.color = "#ff0000";
                    commentList.appendChild(newComment);
                });
            }
        }

        function addComment() {
            const commentInput = document.getElementById("commentInput");
            const commentText = commentInput.value.trim();
            if (commentText === "") {
                alert("留言內容不能為空！");
                return;
            }
            comments.push(commentText);
            commentInput.value = "";
            loadComments();
        }

        document.addEventListener("DOMContentLoaded", loadComments);
    </script>
</body>
</html>
